    dtypes: {in: [fp32, bf16], acc: [fp32], out: [fp32, bf16]}
    tolerance:
      fp32: {max_abs_diff: 7.6e-05, rel: 1.7e-04, note: "1.69M 缩放模型，argmax 一致"}
      bf16: {max_abs_diff: 1.27e-02, mean_abs_diff: 3.7e-04, note: "argmax 一致"}
    perf:
      machine: 910b4x2-206
      measured_at: 2026-10-28
      note: "实测为 naive 参考实现，非优化版；用于量化'不做 kernel 有多慢'"
      cases:
        - {params: 1.54e9, T: 1, latency_ms: 30.88, effective_gbs: 99.6, roofline_pct: 7}
        - {params: 1.54e9, T: 128, latency_ms: 251.8, effective_gbs: 12.2}
        - {params: 1.54e9, T: 512, latency_ms: 955.3, effective_gbs: 3.2}
    known_issues:
