# ============ 质量门禁 ============
gates:
  L1_available: {require: ["精度对 CPU 参考通过", "3 个 shape 跑通"], verify: ci/precision_gate.py}
  L2_qualified: {require: ["mem_floor_pct >= 60%（访存型）或 tflops_peak_pct >= 70%（计算型）"], verify: "msprof 报告 + 评审"}
  L3_excellent: {require: ["T=1/4/8/64 与 T=1024 全部达标", "30 天无回归 > 5%"], verify: "性能评审会"}
